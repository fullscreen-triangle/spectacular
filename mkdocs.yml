site_name: spectacular-charts
site_description: Linked, crossfiltered charts for Python and Jupyter, described in JSON instead of plotting code.
site_url: https://fullscreen-triangle.github.io/spectacular/
repo_url: https://github.com/fullscreen-triangle/spectacular
repo_name: fullscreen-triangle/spectacular
edit_uri: edit/rebuild/docs/
copyright: MIT licence

docs_dir: docs
# The script that draws the images is not a page.
exclude_docs: |
  figures.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle: { icon: material/weather-night, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle: { icon: material/weather-sunny, name: Light }
  icon:
    logo: material/chart-scatter-plot
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Quickstart: quickstart.md
  - Guide:
      - Describing charts: guide/describing.md
      - Chart types: guide/chart-types.md
      - Colours, orders and themes: guide/colours.md
      - Brushing and selections: guide/selections.md
      - Notebooks: guide/notebooks.md
      - Figures and pages: guide/figures.md
      - Data: guide/data.md
      - Command line: guide/command-line.md
      - Descriptions and specs: guide/specs.md
  - Reference:
      - Python API: reference/python.md
      - Description keys: reference/keys.md
      - View specs: reference/spec.md
  - For AI agents: for-ai.md
  - Troubleshooting: troubleshooting.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [python, "."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fullscreen-triangle/spectacular
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/spectacular-charts/

validation:
  links:
    not_found: warn
    anchors: warn
