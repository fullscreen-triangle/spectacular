[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "spectacular-charts"
version = "0.2.1"
description = "Linked, crossfiltered charts in Jupyter, described in JSON instead of plotting code"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Kundai Farai Sachikonye" }]
keywords = ["visualization", "charts", "crossfilter", "jupyter", "anywidget", "webassembly", "linked-views", "brushing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Visualization",
]
# The core (descriptions, validation, offline pages) needs only the standard library and
# the native command this wheel carries. Views in a notebook need anywidget; figures need
# a headless browser.
dependencies = []

[project.optional-dependencies]
notebook = ["anywidget>=0.9"]
render = ["playwright>=1.40"]
test = ["pytest", "anywidget>=0.9", "numpy", "pandas"]

[project.urls]
Homepage = "https://fullscreen-triangle.github.io/spectacular/"
Documentation = "https://fullscreen-triangle.github.io/spectacular/"
Source = "https://github.com/fullscreen-triangle/spectacular/tree/rebuild"
Issues = "https://github.com/fullscreen-triangle/spectacular/issues"
Changelog = "https://github.com/fullscreen-triangle/spectacular/blob/rebuild/python/CHANGELOG.md"

[tool.maturin]
# The wheel carries the `spectacular` command (crates/spectacular) as a script, beside the
# Python package and its browser runtime (built by `npm run build:python`, not committed).
bindings = "bin"
manifest-path = "../crates/spectacular/Cargo.toml"
python-source = "src"
python-packages = ["spectacular"]
# Installed as spectacular-charts, imported as spectacular.
module-name = "spectacular"
include = [{ path = "src/spectacular/static/*", format = ["sdist", "wheel"] }]
exclude = [{ path = "src/spectacular/__pycache__/*", format = ["sdist", "wheel"] }]
strip = true
