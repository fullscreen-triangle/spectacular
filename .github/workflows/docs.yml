# Builds the documentation site (MkDocs Material, from docs/ and mkdocs.yml) and
# publishes it to GitHub Pages at https://fullscreen-triangle.github.io/spectacular/.
# Pages must use "GitHub Actions" as its source (Settings -> Pages). The examples in the
# pages are run by python/tests/test_docs.py, with the package's other tests.
name: docs

on:
  workflow_dispatch:
  push:
    branches: [rebuild]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "spectacular-specifications.md"
      - "python/CHANGELOG.md"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.8.2 pymdown-extensions==13.1.2
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
