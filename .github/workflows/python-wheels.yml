# Builds the `spectacular-charts` wheels: the Python package, its browser runtime, and the
# native `spectacular` command compiled for each platform, then installs each wheel alone
# and runs the tests against it. Runs on pushes to rebuild that touch the package (build
# and test only), by hand, and on tags named py-v* (e.g. py-v0.2.0), which also publish
# to PyPI through trusted publishing: the project's publisher on PyPI names this
# repository, this workflow (python-wheels.yml) and the environment `pypi`.
name: python wheels

on:
  workflow_dispatch:
  push:
    tags: ["py-v*"]
    branches: [rebuild]
    paths:
      - "python/**"
      - "crates/**"
      - "packages/viz/src/**"
      - "packages/viz/vite.notebook.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/python-wheels.yml"

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    # The browser runtime is the same on every platform: build it once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build:wasm
      - run: npm ci
      - run: npm run build:python
      - uses: actions/upload-artifact@v4
        with:
          name: runtime
          path: python/src/spectacular/static

  wheels:
    needs: runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          # Intel Macs are cross-compiled on an Apple silicon runner. macos-latest, not a
          # numbered image: GitHub retires those (macos-13 and macos-14 are gone).
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime
          path: python/src/spectacular/static
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist/*.whl

  test:
    # The wheel, installed alone, must compile descriptions with its own command.
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true
      - run: pip install --find-links wheels "spectacular-charts[test]"
        shell: bash
      # From the repository root, `import spectacular` still finds the installed wheel:
      # python/src is not on the path.
      - run: pytest python/tests -q
        shell: bash

  sdist:
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime
          path: python/src/spectacular/static
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: [wheels, sdist, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
